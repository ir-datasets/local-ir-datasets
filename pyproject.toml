[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ir-datasets"
version = "0.1.0"
description = "ir_datasets provider for locally provided datasets."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "local-ir-datasets contributors" }
]

[project.optional-dependencies]
full = [
  "tira",
]
test = [
  "coverage[toml]>=7.6",
  "pytest>=8.3",
  "local-ir-datasets[full]",
  "python-terrier",
  "ir_measures",
]

[project.entry-points."ir_datasets.providers"]
hf-local = "local_ir_datasets.hf_local_provider:provider"
tira-local = "local_ir_datasets.tira_local_provider:provider"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["local_ir_datasets"]

[tool.coverage.report]
show_missing = true
